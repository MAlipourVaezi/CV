name: Publish CV

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.tex"
      - "**.cls"
      - "**.sty"
      - "**.bib"
      - ".github/workflows/publish-cv.yml"
  schedule:
    # Check Overleaf twice per hour when its secrets are configured.
    - cron: "7,37 * * * *"

permissions:
  contents: read

concurrency:
  group: cv-pages
  cancel-in-progress: false

env:
  ROOT_TEX: CV.tex

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub source
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Pull latest Overleaf project when configured
        env:
          OVERLEAF_PROJECT_ID: ${{ secrets.OVERLEAF_PROJECT_ID }}
          OVERLEAF_GIT_TOKEN: ${{ secrets.OVERLEAF_GIT_TOKEN }}
        run: |
          if [ -z "$OVERLEAF_PROJECT_ID" ] && [ -z "$OVERLEAF_GIT_TOKEN" ]; then
            echo "Overleaf is not configured. Building the CV committed to GitHub."
            exit 0
          fi

          if [ -z "$OVERLEAF_PROJECT_ID" ] || [ -z "$OVERLEAF_GIT_TOKEN" ]; then
            echo "Set both OVERLEAF_PROJECT_ID and OVERLEAF_GIT_TOKEN to enable Overleaf updates."
            exit 1
          fi

          ASKPASS_FILE="$(mktemp "$RUNNER_TEMP/overleaf-askpass.XXXXXX")"
          trap 'rm -f "$ASKPASS_FILE"' EXIT
          cat > "$ASKPASS_FILE" <<'EOF'
          #!/bin/sh
          case "$1" in
            *sername*) printf '%s\n' "git" ;;
            *assword*) printf '%s\n' "$OVERLEAF_GIT_TOKEN" ;;
          esac
          EOF
          chmod 700 "$ASKPASS_FILE"

          rm -rf source
          GIT_ASKPASS="$ASKPASS_FILE" GIT_TERMINAL_PROMPT=0 \
            git clone --depth=1 "https://git.overleaf.com/${OVERLEAF_PROJECT_ID}" source

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            fonts-croscore
          fc-cache -f

      - name: Compile CV
        working-directory: source
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error "$ROOT_TEX"
          test -s "${ROOT_TEX%.tex}.pdf"

      - name: Prepare published files
        run: |
          mkdir -p published
          cp "source/${ROOT_TEX%.tex}.pdf" published/cv.pdf
          touch published/.nojekyll
          cat > published/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Curriculum Vitae</title>
            <meta http-equiv="refresh" content="0; url=cv.pdf">
          </head>
          <body>
            <p><a href="cv.pdf">Open Curriculum Vitae</a></p>
          </body>
          </html>
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: published

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publish CV
        id: deployment
        uses: actions/deploy-pages@v4
